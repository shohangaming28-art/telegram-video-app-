<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Video App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        h1, h2 { text-align: center; color: #38bdf8; }
        .card { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        video { width: 100%; border-radius: 5px; }
        button { background: #0ea5e9; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 5px;}
        button:hover { background: #0284c7; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #334155; border: 1px solid #475569; color: white; border-radius: 5px; box-sizing: border-box;}
        .admin-section { display: none; margin-top: 30px; border-top: 2px dashed #475569; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Telegram Video App</h1>
        
        <div id="video-feed">
            <h3>Video Feed</h3>
            <div id="video-list"> Loading... </div>
        </div>

        <button onclick="toggleAdminPanel()" style="background: #334155; margin-top: 40px;">Admin Control Panel</button>

        <div id="admin-panel" class="admin-section">
            <h2>Admin Panel</h2>
            <div id="login-box">
                <input type="password" id="admin-pass" placeholder="Enter admin password">
                <button onclick="adminLogin()">Login</button>
            </div>
            
            <div id="dashboard" style="display:none;">
                <p style="color: #4ade80; text-align: center;">Login successful!</p>
                <h3>Add New Video</h3>
                <input type="text" id="v-title" placeholder="Video Title">
                <input type="text" id="v-url" placeholder="Direct MP4 Video URL">
                <button onclick="addVideo()">Add Video</button>
            </div>
        </div>
    </div>

    <script>
        async function loadVideos() {
            const res = await fetch('/api/videos');
            const videos = await res.json();
            const listDiv = document.getElementById('video-list');
            listDiv.innerHTML = '';

            videos.forEach(v => {
                listDiv.innerHTML += `
                    <div class="card">
                        <h4>${v.title}</h4>
                        <video controls onplay="triggerAd()">
                            <source src="${v.url}" type="video/mp4">
                        </video>
                    </div>
                `;
            });
        }

        function triggerAd() {
            alert("Monetag Ad Triggered!");
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        async function adminLogin() {
            const pass = document.getElementById('admin-pass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                alert(data.message);
            }
        }

        async function addVideo() {
            const title = document.getElementById('v-title').value;
            const url = document.getElementById('v-url').value;
            const password = document.getElementById('admin-pass').value;

            const res = await fetch('/api/admin/add-video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, url, password })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) {
                document.getElementById('v-title').value = '';
                document.getElementById('v-url').value = '';
                loadVideos();
            }
        }

        loadVideos();
    </script>
</body>
</html>
